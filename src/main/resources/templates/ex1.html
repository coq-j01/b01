<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title>Insert title here</title>
</head>
<body>
<h1>[[${list}]]</h1>
<h1 th:text=${list}></h1>
<div th:with="num1 = ${10}, num2=${20}">
	<h4 th:text="${num1+num2}"></h4>
</div>
<ul>
	<li>AAA</li>
	<li>BBB</li>
	<li>CCC</li>
</ul>
<hr/>
<ul>
	<li th:each="str:${list}" th:text=${str}></li>
</ul>
<hr/>
<ul>
	<th:block th:each="str:${list}">
		<li th:text=${str}></li>
	</th:block>
</ul>
<hr/>
<ul>
	<th:block th:each="str:${list}">
		<li>[[${str}]]</li>
	</th:block>
</ul>
<hr/>
<ul>
	<th:block th:each="str,status:${list}">
		<li>[[${status.index}]] - [[${str}]]</li>
		<li>[[${status.odd}]] - [[${str}]]</li>
	</th:block>
</ul>
<hr/>
<ul>
	<th:block th:each="str,status:${list}">
		<li>
			<span th:if="${status.odd}">ODD - [[${str}]]</span>
			<span th:unless="${status.odd}">EVEN - [[${str}]]</span>
		</li>
	</th:block>
</ul>
<hr/>
<ul>
	<th:block th:each="str,status:${list}">
		<li>
			<span th:text="${status.odd} ? '홀수 ' + ${str} :'짝수 ' + ${str} "></span>
		</li>
	</th:block>
</ul>
<hr/>
<ul>
	<th:block th:each="str,status:${list}">
		<li>
		<th:block th:switch="${status.index % 3}">
			<span th:case="0">0</span>
			<span th:case="1">1</span>
			<span th:case="2">2</span>
		</th:block>
		</li>
	</th:block>
</ul>
<hr/>
<ul>
	<th:block th:each="str,status:${list}">
		 <li>
            <span >3으로 나눈 나머지 [[${status.index % 3}]] - [[${str}]]</span> 
        </li>
	</th:block>
</ul>
<a th:href="@{/hello}">Go to /hello</a><br/>
<a th:href="@{/hello(name='한글전달',age=10)}">Go to /hello(name,age)</a><br/>
<a th:href="@{/hello(tids=${ {10,20,30,40} },age=10)}">Go to /hello(배열,age)</a><br/>
</body>
</html>
