<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
	crossorigin="anonymous">

<title>Board Register</title>
</head>

<body>

	<div class="container-fluid">

		<div class="row">

			<!-- header -->
			<div class="row">
				<div class="col">

					<nav class="navbar navbar-expand-lg navbar-light bg-light">
						<div class="container-fluid">

							<a class="navbar-brand" href="#">Navbar</a>

							<button class="navbar-toggler" type="button"
								data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
								aria-controls="navbarNavAltMarkup" aria-expanded="false"
								aria-label="Toggle navigation">
								<span class="navbar-toggler-icon"></span>
							</button>

							<div class="collapse navbar-collapse" id="navbarNavAltMarkup">
								<div class="navbar-nav">
									<a class="nav-link active" aria-current="page" href="#">Home</a>
									<a class="nav-link" href="#">Features</a> <a class="nav-link"
										href="#">Pricing</a> <a class="nav-link disabled">Disabled</a>
								</div>
							</div>

						</div>
					</nav>

				</div>
			</div>
			<!-- header end -->


			<!-- content -->
			<div class="row content">
				<div class="col">

					<div class="card">

						<div class="card-header">Featured</div>

						<div class="card-body">

							<form id="tForm" name="tForm" action="/board/register"
								method="post">
								<input type="hidden" th:name="${_csrf.parameterName}"
									th:value="${_csrf.token}">

								<!-- Title -->
								<div class="input-group mb-3">
									<span class="input-group-text">Title</span> <input type="text"
										id="title" name="title" class="form-control"
										placeholder="Title" required="required">
								</div>


								<!-- Content -->
								<div class="input-group mb-3">
									<!-- <span class="input-group-text">Content</span> -->

									<textarea id="content" name="content"
										class="form-control col-sm-5" rows="5" required="required"></textarea>
								</div>


								<!-- Writer -->
								<div class="input-group mb-3">
									<span class="input-group-text">Writer</span> <input type="text"
										id="writer" name="writer" class="form-control"
										placeholder="Writer"
										th:value="${#authentication.principal.username}" readonly>
								</div>


								<!-- 첨부파일 추가 -->
								<div class="input-group mb-3 gap-2">

									<span class="input-group-text">Images</span>

									<div class="float-end uploadHidden">
										<button type="button" class="btn btn-primary uploadFileBtn">
											ADD Files</button>
									</div>

								</div>


								<!-- 버튼 -->
								<div class="my-4">
									<div class="float-end">

										<button type="submit" class="btn btn-primary subminBtn">
											Submit</button>

										<button type="reset" class="btn btn-secondary">Reset</button>

									</div>
								</div>

							</form>

						</div>
					</div>

				</div>
			</div>


			<!-- 첨부 파일 섬네일 -->
			<div class="row mt-3">
				<div class="col">

					<div class="container-fluid d-flex uploadResult"
						style="flex-wrap: wrap;"></div>

				</div>
			</div>


			<!-- 첨부파일 추가 모달 -->
			<div class="modal uploadModal" tabindex="-1">

				<div class="modal-dialog">

					<div class="modal-content">

						<div class="modal-header">

							<h5 class="modal-title">Upload File</h5>

							<button type="button" class="btn-close" data-bs-dismiss="modal"
								aria-label="Close"></button>

						</div>


						<div class="modal-body">

							<div class="input-group mb-3">
								<input type="file" name="files" class="form-control" multiple>
							</div>

						</div>


						<div class="modal-footer">

							<button type="button" class="btn btn-primary uploadBtn">
								Upload</button>

							<button type="button" class="btn btn-outline-dark closeUploadBtn">
								Close</button>

						</div>

					</div>
				</div>
			</div>
			<!-- register modal -->


			<!-- Bootstrap -->
			<script
				src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
				integrity="..." crossorigin="anonymous">
			</script>

			<!-- jQuery -->
			<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>

			<!-- Axios -->
			<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>


			<script th:inline="javascript">

            const auth = [[${#authentication.principal}]];

            const errors = [[${errors}]];
            console.log(errors);

            let msg = "";

            if (errors) {

                for (let i = 0; i < errors.length; i++) {
                    msg += `${errors[i].field}은(는) ${errors[i].code} \n`;
                }

                alert(msg);
            }


            /* ========================================
               게시물 등록
            ======================================== */

            document
                .querySelector(".subminBtn")
                .addEventListener("click", function (e) {

                    e.preventDefault();
                    e.stopPropagation();

                    const target = document.querySelector(".uploadHidden");

                    const uploadFiles = document
                        .querySelector(".uploadResult")
                        .querySelectorAll("img");

                    let str = "";

                    for (let i = 0; i < uploadFiles.length; i++) {

                        const uploadFile = uploadFiles[i];

                        const imgLink =
                            uploadFile.getAttribute("data-key");

                        str += `
                            <input
                                type="hidden"
                                name="fileNames"
                                value="${imgLink}"
                            >
                        `;
                    }

                    target.innerHTML = str;

                    // 폼 제출
                    tForm.submit();

                    /*
                     * 폼 제출말고 REST API를 이용하는 방법이 더 좋음
                     * 폼 제출 실패 시 작성 중인 내용이 초기화되는 문제가 발생하기 때문
                     * REGISTER 실패 시 REDIRECT하도록 구성되어 있음
                     */

                }, false);


            /* ========================================
               파일 업로드 함수
            ======================================== */

            async function uploadToServer(formObj) {

                console.log("upload to server " + formObj);

                const response = await axios.post(
                    `/upload`,
                    formObj,
                    {
                        headers: {
                            "Content-Type": "multipart/form-data"
                        }
                    }
                );

                return response.data;
            }


            /* ========================================
               파일 삭제 요청
            ======================================== */

            async function removeFileToServer(filename) {

                console.log("delete filename : " + filename);

                const response =
                    await axios.delete(`/remove/${filename}`);

                return response.data;
            }


            /* ========================================
               파일 삭제 실행
            ======================================== */

            function removeFile(uuid, filename, obj) {

            	const targetFilename = uuid + "_" + filename;
            	console.log("삭제할 파일명 >>> " + targetFilename);

                const targetDiv = obj.closest(".card");

                removeFileToServer(targetFilename)
                    .then(result => {
                        targetDiv.remove();
                    });
            }


            /* ========================================
               파일 업로드 Modal
            ======================================== */

            const uploadModal =
                new bootstrap.Modal(
                    document.querySelector(".uploadModal")
                );


            /* ========================================
               첨부 파일 화면 출력
            ======================================== */

            function showUploadFile(fileObj) {

                console.log("fileObj " + fileObj);

                const str = `
                    <div class="card col-4">

                        <div class="card-header d-flex justify-content-center">

                            ${fileObj.filename}

                            <button
                                class="btn-sm btn-danger"
                                onclick="javascript:removeFile('${fileObj.uuid}','${fileObj.filename}', this)"
                            >
                                X
                            </button>

                        </div>

                        <div class="card-body">

                            <img
                                src="${fileObj.realFilename}"
                                data-key="${fileObj.uuid}_${fileObj.filename}"
                                style="
                                       width: 150px;
                                       height: 150px;
                                       object-fit: cover;
                                "
                            >

                        </div>

                    </div>
                `;

                document
                    .querySelector(".uploadResult")
                    .innerHTML += str;
            }


            /* ========================================
               ADD Files 버튼
            ======================================== */

            $(".uploadFileBtn").on("click", function (e) {

                e.preventDefault();
                e.stopPropagation();

                uploadModal.show();
            });


            /* ========================================
               Modal Close 버튼
            ======================================== */

            $(".closeUploadBtn").on("click", function (e) {

                e.preventDefault();
                e.stopPropagation();

                document
                    .querySelector("input[name='files']")
                    .value = "";

                uploadModal.hide();
            });


            /* ========================================
               파일 Upload 버튼
            ======================================== */

            $(".uploadBtn").on("click", function (e) {

                e.preventDefault();
                e.stopPropagation();

                const formObj = new FormData();

                const fileInput =
                    document.querySelector("input[name='files']");

                console.log(fileInput.files);

                const files = fileInput.files;

                for (let i = 0; i < files.length; i++) {
                    formObj.append("files", files[i]);
                }

                uploadToServer(formObj)
                    .then(result => {

                        console.log("result = " + result);

                        if (result && result.length > 0) {

                            result.forEach(fileObj => {
                                showUploadFile(fileObj);
                            });

                        }

                        fileInput.value = "";
                        uploadModal.hide();

                    })
                    .catch(e => {
                        uploadModal.hide();
                    });

            });

        </script>

		</div>

		<!-- Footer -->
		<div class="row footer">

			<div class="row fixed-bottom" style="z-index: -100">
				<footer class="py-1 my-1">
					<p class="text-center text-muted">Footer</p>
				</footer>
			</div>

		</div>

	</div>

</body>
</html>
