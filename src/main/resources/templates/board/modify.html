                         <!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
	crossorigin="anonymous">

<title>Hello, world!</title>
</head>
<body>

	<div class="container-fluid">
		<div class="row">
			<!-- 기존의 <h1>Header</h1> -->
			<div class="row">
				<div class="col">
					<nav class="navbar navbar-expand-lg navbar-light bg-light">
						<div class="container-fluid">
							<a class="navbar-brand" href="#">Navbar</a>
							<button class="navbar-toggler" type="button"
								data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
								aria-controls="navbarNavAltMarkup" aria-expanded="false"
								aria-label="Toggle navigation">
								<span class="navbar-toggler-icon"></span>
							</button>
							<div class="collapse navbar-collapse" id="navbarNavAltMarkup">
								<div class="navbar-nav">
									<a class="nav-link active" aria-current="page" href="#">Home</a>
									<a class="nav-link" href="#">Features</a> <a class="nav-link"
										href="#">Pricing</a> <a class="nav-link disabled">Disabled</a>
								</div>
							</div>
						</div>
					</nav>
				</div>
			</div>
			<!-- header end -->
			<!-- 기존의 <h1>Header</h1>끝 -->

			<div class="row content">
				<div class="col">
					<div class="card">
						<div class="card-header">Board Modify</div>
						<div class="card-body">
							<form th:action="@{/board/modify}" method="post" id="f1">
								<div class="input-group mb-3">
									<span class="input-group-text">BNO</span> <input type="text"
										name="bno" class="form-control" th:value="${dto.bno}" readonly>
								</div>
								<div class="input-group mb-3">
									<span class="input-group-text">Title</span> <input type="text"
										name="title" class="form-control" th:value="${dto.title}">
								</div>
								<div class="input-group mb-3">
									<span class="input-group-text">Content</span>
									<textarea id="content" name="content"
										class="form-control col-sm-5" rows="5">[[${dto.content}]]</textarea>
								</div>

								<div class="input-group mb-3">
									<span class="input-group-text">Writer</span> <input type="text"
										name="writer" class="form-control" th:value="${dto.writer}"
										readonly>
								</div>
								<div class="input-group mb-3 gap-2">
									<span class="input-group-text">Images</span>
									<div class="float-end uploadHidden">
										<button type="button" class="btn btn-primary uploadFileBtn">ADD
											Files</button>
									</div>
								</div>

								<div class="input-group mb-3">
									<span class="input-group-text">RegDate</span> <input
										type="date" class="form-control"
										th:value="${#temporals.format(dto.regDate, 'yyyy-MM-dd')}"
										readonly>
								</div>

								<div class="input-group mb-3">
									<span class="input-group-text">ModDate</span> <input
										type="date" class="form-control"
										th:value="${#temporals.format(dto.modDate, 'yyyy-MM-dd')}"
										readonly>
								</div>

								<div class="my-4">
									<div class="float-end">
										<button type="button" class="btn btn-danger removeBtn">Remove</button>
										<button type="button" class="btn btn-primary modifyBtn">Modify</button>
										<a type="button" class="btn btn-secondary"
											th:href="@{'/board/list?' + ${pageRequestDTO.link}}">List</a>
									</div>
								</div>
							</form>

						</div>

					</div>
				</div>
			</div>
			<!-- 첨부 파일 섬네일을 보여줄 부분 -->
			<div class="row mt-3">
				<div class="col ">
					<div class="container-fluid d-flex uploadResult"
						style="flex-wrap: wrap;">
						<th:block th:each="fileName:${dto.fileNames}">
							<div class="card col-4" th:with="arr = ${fileName.split('_')}">
								<div class="card-header d-flex justify-content-center">
									[[${arr[1]}]]
									<button class="btn-sm btn-danger"
										th:onclick="removeFile([[${fileName}]], this)">X</button>
								</div>
								<div class="card-body">
									<img th:src="|/view/s_${fileName}|" th:data-src="${fileName}">
								</div>
							</div>
							<!-- card -->
						</th:block>
					</div>
				</div>
			</div>

			<!-- 첨부파일 추가를 위한 모달창 -->
			<div class="modal uploadModal" tabindex="-1">
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title">Upload File</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"
								aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<div class="input-group mb-3">
								<input type="file" name="files" class="form-control" multiple>
							</div>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-primary uploadBtn">Upload</button>
							<button type="button" class="btn btn-outline-dark closeUploadBtn">Close</button>
						</div>
					</div>
				</div>
			</div>
			<!-- register modal -->
		</div>
		<div class="row content"></div>
		<div class="row footer">
			<!--<h1>Footer</h1>-->

			<div class="row   fixed-bottom" style="z-index: -100">
				<footer class="py-1 my-1 ">
					<p class="text-center text-muted">Footer</p>
				</footer>
			</div>

		</div>
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js">
	</script>

	<script src="https://code.jquery.com/jquery-1.12.4.min.js">
	</script>
	<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

	<script th:inline="javascript">
                    	const errors=[[${errors}]] 
                		console.log(errors);
                		let msg = "";
                		if(errors){
                			for (let i =0; i<errors.length; i++) {
                    			msg += `${errors[i].field}은(는) ${errors[i].code} \n`
                    		}
                			alert(msg);                              	
                		}

                        const formObj = document.querySelector("#f1")
                        document.querySelector(".removeBtn").addEventListener("click",function(e) {

                            e.preventDefault()
                            e.stopPropagation()
                            if (confirm("삭제하겠습니까?")) {
	                            formObj.action ="/board/remove"
	                            formObj.method ="post"
	
	                            formObj.submit()
                            }
                        },false);


                        $(".modifyBtn").on("click",function(e) {
                        	 console.log("modify 클릭!!!");

                        	e.preventDefault();
                            e.stopPropagation();

                            const uploadFiles =
                                document.querySelector(".uploadResult").querySelectorAll("img");

                            let str = "";

                            for (let i = 0; i < uploadFiles.length; i++) {

                                const uploadFile = uploadFiles[i];

                                const imgLink = uploadFile.getAttribute("data-src");

                                str += `
                                    <input type="hidden"
                                           name="fileNames"
                                           value="${imgLink}">
                                `;
                            }

                            document.querySelector(".uploadHidden").innerHTML = str;

                            if (confirm("수정하겠습니까?")) {
                            	
                            	 // X 눌러둔 파일들을 이때 실제 삭제
                            	let promises = [];

                                for (let i = 0; i < removeFiles.length; i++) {
                                    promises.push(removeFileToServer(removeFiles[i]));
                                }
								//삭제할 파일이 여러 개 일 수 있어 promise.all로 실행
                                Promise.all(promises).then(() => {

                                	//실행순서 보장을 위해 then안에서 form제출
                                    formObj.action = "/board/modify";
                                    formObj.method = "post";
                                    formObj.submit();

                                });
                            }
                        });
                        const removeFiles = [];
                      //파일 업로드 함수
                      	async function uploadToServer(formObj){
                      		console.log("upload to server" + formObj);
                      		
                      		const response = await axios.post(`/upload`,formObj,{
                      			headers:{
                      				"Content-Type":"multipart/form-data"
                      			}
                      		});
                      		return response.data;
                      	}
                      	//파일 삭제 함수
                      	async function removeFileToServer(filename){
                      		console.log("delete filename : " + filename);
                      		const response = await axios.delete(`/remove/${filename}`);
                      		return response.data;
                      		
                      	}
                      	//파일 삭제 화면에서만 실행
                      	function removeFile(filename,obj){
                      		console.log(filename);
                      		 // 삭제할 파일명 기억
                      	    removeFiles.push(filename);

                      	    // 화면에서만 제거
                      	    const targetDiv = obj.closest(".card");
                      	    targetDiv.remove();
                      	}
                      	const uploadModal = new bootstrap.Modal(document.querySelector(".uploadModal"));
                      	//첨부 파일 출력
                      	function showUploadFile(fileObj){
                      		console.log("fileObj =", fileObj);

                      	    const str = `
                      	        <div class="card col-4">

                      	            <div class="card-header d-flex justify-content-center">
                      	                ${fileObj.filename}

                      	                <button type="button"
                      	                        class="btn-sm btn-danger"
                      	                        onclick="removeFile('${fileObj.realFilename}', this)"> <!--ONCLICK은 분리해주는게 좋음-->
                      	                    X
                      	                </button>
                      	            </div>

                      	            <div class="card-body">
                      	                <img src="/view/${fileObj.link}"
                      	                     data-src="${fileObj.realFilename}">
                      	            </div>

                      	        </div>
                      	    `;

                      	    document.querySelector(".uploadResult").innerHTML += str;
                      	  }
                      	//addfile 버튼 설정
                      	$(".uploadFileBtn").on("click", function(e){
                      		e.preventDefault();
            	            e.stopPropagation();
                      		uploadModal.show();
                      	})
                      	$(".closeUploadBtn").on("click",function(e){
                      		document.querySelector("input[name='files']").value = "";
                      		uploadModal.hide();
                      	})
                      	//파일 업로드 버튼
                      	$(".uploadBtn").on("click", function(e){
                      		 e.preventDefault();
                      	    e.stopPropagation();

                      	    const formObj = new FormData();

                      	    const fileInput = document.querySelector("input[name='files']");
                      	    const files = fileInput.files;

                      	    for (let i = 0; i < files.length; i++) {
                      	        formObj.append("files", files[i]);
                      	    }

                      	    uploadToServer(formObj)
                      	        .then(result => {

                      	            console.log("result =", result);

                      	            if (result && result.length > 0) {
                      	                result.forEach(fileObj => {
                      	                    showUploadFile(fileObj);
                      	                });
                      	            }

                      	            fileInput.value = "";
                      	            uploadModal.hide();

                      	        })
                      	        .catch(e => {
                      	            console.error(e);
                      	            uploadModal.hide();
                      	        });
                      	});
           </script>


</body>
</html>
