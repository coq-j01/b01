<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
	crossorigin="anonymous">
<link th:href="@{/css/styles.css}" rel="stylesheet" />
<head>
<meta charset="utf-8" />
<title>Member Join Page</title>
</head>

<div>
	<div class="row mt-3">
		<div class="col">
			<div class="card">
				<div class="card-header">JOIN</div>
				<div class="card-body">
					<form id="registerForm" action="/member/join" method="post">
						<div class="input-group mb-3">
							<span class="input-group-text">MID</span> <input type="text"
								name="mid" class="form-control">
						</div>

						<div class="input-group mb-3">
							<span class="input-group-text">MPW</span> <input type="password"
								name="mpw" class="form-control">
						</div>

						<div class="input-group mb-3">
							<span class="input-group-text">EMAIL</span> <input type="email"
								name="email" class="form-control">
						</div>

						<div class="my-4">
							<div class="float-end">
								<button type="submit" class="btn btn-primary submitBtn">Submit</button>
								<button type="reset" class="btn btn-secondary">Reset</button>
							</div>
						</div>
					</form>
				</div>
				<!--end card body-->

			</div>
			<!--end card-->
		</div>
		<!-- end col-->
	</div>
	<!-- end row-->
</div>

<script th:inline="javascript">
	const error = [[${error}]]

	if(error && error === 'mid'){
    	alert("동일한 MID를 가진 계정이 존재합니다.");
	}
</script>
