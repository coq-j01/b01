<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<title>Insert title here</title>
</head>
<body>
	<div class="container mt-4">

		<div class="card">

			<div class="card-header">회원 정보 수정</div>

			<div class="card-body">

				<form id="modifyForm" action="/member/modify" method="post">

					<!-- MID -->
					<div class="input-group mb-3">
						<span class="input-group-text"> MID </span> <input type="text"
							name="mid" class="form-control" th:value="${member.mid}" readonly>
					</div>


					<!-- EMAIL -->
					<div class="input-group mb-3">
						<span class="input-group-text"> EMAIL </span> <input type="email"
							name="email" class="form-control" th:value="${member.email}">
					</div>


					<!-- ROLE -->
					<div class="mb-3">

						<label class="form-label"> ROLE </label> <select name="roleSet"
							class="form-select">

							<option value="USER">USER</option>

							<option value="MANAGER">MANAGER</option>

							<option value="ADMIN">ADMIN</option>

						</select>

					</div>


					<div class="float-end">
							<input type="hidden" th:name="${_csrf.parameterName}"
								th:value="${_csrf.token}">
							<button type="submit" class="btn btn-primary" id="modifyBtn">수정</button>
							<button class="btn btn-secondary" id="listBtn"> 목록 </button>
					</div>

				</form>

			</div>

		</div>

	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
		crossorigin="anonymous">
		
	</script>

	<script src="https://code.jquery.com/jquery-1.12.4.min.js"
		integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ="
		crossorigin="anonymous">
		
	</script>
	<script>
		// 목록으로 이동
		$("#listBtn").on("click", function(e) {

			e.preventDefault();

			self.location = "/member/list";
		});
		// 수정
	    $("#modifyBtn").on("click", function(e) {

	        e.preventDefault();

	        if (!confirm("회원 정보를 수정하시겠습니까?")) {
	            return;
	        }

	        $("#modifyForm").submit();
	    });
	</script>
</body>
</html>
