<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<title>Member List</title>
</head>

<body>

	<div class="container-fluid">

		<!-- header -->
		<div class="row">
			<div class="col">

				<nav class="navbar navbar-expand-lg navbar-light bg-light">

					<div class="container-fluid">

						<a class="navbar-brand" th:href="@{/member/list}"> Member </a>

						<div class="navbar-nav">

							<a class="nav-link" th:href="@{/board/list}"> Board </a> <a
								class="nav-link active" th:href="@{/member/list}"> Members </a>

						</div>

					</div>

				</nav>

			</div>
		</div>


		<!-- 검색 -->
		<div class="row content mt-3">

			<div class="col">

				<div class="card">

					<div class="card-body">

						<h5 class="card-title">Search</h5>

						<form id="searchForm" th:action="@{/member/list}" method="get">

							<div class="input-group gap-2">

								<input type="text" name="keyword" class="form-control"
									placeholder="MID 또는 Email 검색" th:value="${keyword}">

								<button class="btn btn-primary" type="submit">Search</button>

								<button class="btn btn-info clearBtn" type="button">
									Clear</button>

							</div>

						</form>

					</div>

				</div>

			</div>

		</div>


		<!-- 회원 목록 -->
		<div class="row content mt-3">

			<div class="col">

				<div class="card">

					<div class="card-header">Member Management</div>

					<div class="card-body">

						<h5 class="card-title mb-3">회원 목록</h5>


						<!-- 페이지 사이즈 -->
						<select class="form-select form-select-sm mb-3" id="size"
							style="width: 100px;">

							<option value="10" th:selected="${pageResponse.size == 10}">
								10</option>

							<option value="30" th:selected="${pageResponse.size == 30}">
								30</option>

							<option value="50" th:selected="${pageResponse.size == 50}">
								50</option>

						</select>


						<!-- 회원 테이블 -->
						<table class="table table-hover">

							<thead>

								<tr>
									<th>MID</th>
									<th>EMAIL</th>
									<th>ROLE</th>
									<th>탈퇴 여부</th>
								</tr>

							</thead>

							<tbody>

								<tr th:each="member : ${pageResponse.content}">

									<td><a th:href="@{/member/read(mid=${member.mid})}"
										class="text-decoration-none"> [[${member.mid}]] </a></td>

									<td>[[${member.email}]]</td>

									<td>[[${member.roleSet}]]</td>

									<td><span th:if="${member.del}" class="badge bg-danger">
											탈퇴 </span> <span th:unless="${member.del}" class="badge bg-success">
											정상 </span></td>

									<!-- 관리 -->
									<td>
										<!-- 수정 -->
										<a th:href="@{/member/modify(mid=${member.mid})}"
										class="btn btn-sm btn-info"> 수정 </a>
										<form class="withdrawForm d-inline" th:action="@{/member/remove}"
											method="post">

											<!-- CSRF -->
											<input type="hidden" th:name="${_csrf.parameterName}"
												th:value="${_csrf.token}">

											<!-- 탈퇴시킬 회원 MID -->
											<input type="hidden" name="mid" class="withdrawMid"
												th:value="${member.mid}">

											<button type="submit" class="btn btn-sm btn-danger"
												onclick="return confirm('해당 회원을 탈퇴 처리하시겠습니까?')">탈퇴
											</button>

										</form>
									</td>

								</tr>

							</tbody>

						</table>

						<!-- 페이지네이션 -->
						<div class="float-end">

							<ul class="pagination">

								<!-- 이전 -->
								<li class="page-item"
									th:classappend="${pageResponse.first} ? 'disabled'"><a
									class="page-link"
									th:href="@{/member/list(
                                        page=${pageResponse.number - 1},
                                        size=${pageResponse.size},
                                        keyword=${keyword}
                                    )}">
										Previous </a></li>


								<!-- 페이지 번호 -->
								<li class="page-item"
									th:each="i : ${#numbers.sequence(0, pageResponse.totalPages - 1)}"
									th:classappend="${i == pageResponse.number} ? 'active'"><a
									class="page-link"
									th:href="@{/member/list(
                                        page=${i},
                                        size=${pageResponse.size},
                                        keyword=${keyword}
                                    )}">

										[[${i + 1}]] </a></li>


								<!-- 다음 -->
								<li class="page-item"
									th:classappend="${pageResponse.last} ? 'disabled'"><a
									class="page-link"
									th:href="@{/member/list(
                                        page=${pageResponse.number + 1},
                                        size=${pageResponse.size},
                                        keyword=${keyword}
                                    )}">
										Next </a></li>

							</ul>

						</div>

					</div>

				</div>

			</div>

		</div>

	</div>


	<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>

	<script th:inline="javascript">

    // 검색 초기화
    $(".clearBtn").on("click", function() {
        self.location = "/member/list";
    });


    // 페이지 크기 변경
    $("#size").on("change", function() {

        const size = $(this).val();

        const keyword = [[${keyword}]];

        self.location =
            "/member/list?size=" + size
            + "&keyword=" + keyword;
    });
    
    //탈퇴
    $(".withdrawBtn").on("click", function() {

        const mid = $(this).data("mid");

        if (!confirm(mid + " 회원을 탈퇴 처리하시겠습니까?")) {
            return;
        }

        $(".withdrawMid").val(mid);

        $("#withdrawForm").submit();
    });

</script>

</body>
</html>
